# 编辑
map cmd+left send_text all \x01
map cmd+right send_text all \x05
map opt+left send_text all \x1bb
map opt+right send_text all \x1bf
map cmd+backspace send_text all \x15
map opt+backspace send_text all \x1b\x7f

# 分屏
map cmd+d launch --location=vsplit --cwd=current
map shift+cmd+d launch --location=hsplit --cwd=current
map cmd+enter launch --location=split --cwd=current
map shift+cmd+enter toggle_layout stack
map cmd+w close_window_with_confirmation ignore-shell
map cmd+[ previous_window
map cmd+] next_window
map opt+cmd+left neighboring_window left
map opt+cmd+right neighboring_window right
map opt+cmd+up neighboring_window up
map opt+cmd+down neighboring_window down
map shift+opt+cmd+left move_window left
map shift+opt+cmd+right move_window right
map shift+opt+cmd+up move_window up
map shift+opt+cmd+down move_window down
map shift+cmd+r layout_action rotate
map shift+cmd+e layout_action equalize
map shift+cmd+l next_layout

# 标签与窗口
map cmd+t new_tab_with_cwd
map cmd+n new_os_window_with_cwd
map opt+cmd+w close_tab
map shift+cmd+t select_tab
map shift+cmd+, move_tab_backward
map shift+cmd+. move_tab_forward
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# 效率
map shift+cmd+p command_palette
map shift+cmd+h show_scrollback
map shift+cmd+g show_last_command_output
map shift+cmd+up scroll_to_prompt -1
map shift+cmd+down scroll_to_prompt 1
map shift+cmd+o open_url_with_hints
map shift+cmd+y kitten hints --type path --program -
