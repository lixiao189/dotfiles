# 字体
font_family      family="SauceCodePro Nerd Font Mono" style=Bold
bold_font        family="SauceCodePro Nerd Font Mono" style=Black
italic_font      family="SauceCodePro Nerd Font Mono" style="Bold Italic"
bold_italic_font family="SauceCodePro Nerd Font Mono" style="Black Italic"
font_size        15.0
modify_font      cell_height 108%
disable_ligatures cursor
text_composition_strategy platform
undercurl_style  thin-sparse

# macOS
macos_titlebar_color background
macos_show_window_title_in menubar
macos_menubar_title_max_length 40
macos_option_as_alt left
macos_quit_when_last_window_closed yes
macos_colorspace srgb
macos_traditional_fullscreen no
macos_dock_badge_on_bell yes

# 窗口
background_opacity 1.0
background_blur 0
dynamic_background_opacity no
remember_window_size yes
initial_window_width 120c
initial_window_height 36c
window_padding_width 8 12
placement_strategy center
window_border_width 1pt
draw_minimal_borders yes
inactive_text_alpha 0.78
hide_window_decorations no
confirm_os_window_close -1

# 光标
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval -1
cursor_stop_blinking_after 15.0
cursor_trail 0

# 标签栏
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_align start
tab_bar_min_tabs 2
tab_bar_margin_width 6.0
tab_bar_margin_height 4.0 0.0
tab_bar_show_new_tab_button yes
tab_switch_strategy previous
tab_title_max_length 28
active_tab_font_style bold
inactive_tab_font_style normal
tab_activity_symbol "● "
bell_on_tab "󰂚 "
tab_title_template " {fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{index}: {title}{f' [{num_windows}]' if num_windows > 1 else ''}{' 󰊓' if layout_name == 'stack' and num_windows > 1 else ''} "

# 滚动
scrollback_lines 10000
scrollback_pager_history_size 64
scrollback_fill_enlarged_window yes
pixel_scroll yes
momentum_scroll 0.96
touch_scroll_multiplier 1.0
scrollbar scrolled-or-hovered
scrollbar_interactive yes
scrollbar_width 0.45
scrollbar_hover_width 0.8
scrollbar_radius 0.4
scrollbar_handle_opacity 0.45
progress_bar top

# 鼠标与剪贴板
mouse_hide_wait 2.0
url_style curly
open_url_with default
detect_urls yes
underline_hyperlinks hover
show_hyperlink_targets cmd
copy_on_select no
strip_trailing_spaces smart
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
paste_actions quote-urls-at-prompt,confirm,confirm-if-large
mouse_map left click ungrabbed mouse_handle_click selection prompt
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
mouse_map cmd+left press grabbed discard_event

# 布局
enabled_layouts splits:split_axis=auto;equalize_on_window_close=true, stack, tall:bias=55, fat:bias=55, grid

# 性能与通知
repaint_delay 8
input_delay 2
sync_to_monitor yes
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
notify_on_cmd_finish invisible 10.0

# 集成
shell_integration enabled
auto_reload_config 0.1
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

include keymaps.conf
