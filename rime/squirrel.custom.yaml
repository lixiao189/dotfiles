patch:
  app_options:
    com.apple.Spotlight:
      ascii_mode: true # 开启默认英文
    com.microsoft.VSCode:
      ascii_mode: true
      vim_mode: true
    com.jetbrains.intellij:
      ascii_mode: true
      vim_mode: true
    net.kovidgoyal.kitty:
      ascii_mode: true
      vim_mode: true
    com.googlecode.iterm2:
      ascii_mode: true
      vim_mode: true
    org.alacritty:
      ascii_mode: true
      vim_mode: true
    com.raycast.macos:
      ascii_mode: true
    com.mitchellh.ghostty:
      ascii_mode: true
      vim_mode: true

  style:
    # 选择皮肤，亮色与暗色主题
    color_scheme: nord_light
    color_scheme_dark: nord_dark

    inline_preedit: true

  # 皮肤列表
  preset_color_schemes:
    nord_light:
      name: 北方浅色
      candidate_list_layout: "linear"
      candidate_format: "%c %@ " # 用 1/6 em 空格 U+2005 来控制编号 %c 和候选词 %@ 前后的空间
      font_point: 16
      label_font_point: 14
      corner_radius: 5
      line_spacing: 10
      back_color: 0xF4EFEC
      border_color: 0xF4EFEC
      candidate_text_color: 0xC1A181
      comment_text_color: 0xD0C088
      hilited_back_color: 0xF0E9E5
      hilited_candidate_back_color: 0xE9DED8
      hilited_candidate_text_color: 0xAC815E
      hilited_text_color: 0xAD8EB4
      text_color: 0x7087D0

    nord_dark:
      name: 北方深色
      candidate_list_layout: "linear"
      candidate_format: "%c %@ " # 用 1/6 em 空格 U+2005 来控制编号 %c 和候选词 %@ 前后的空间
      font_point: 16
      label_font_point: 14
      corner_radius: 5
      line_spacing: 10
      back_color: 0x473A33
      border_color: 0x473A33
      candidate_text_color: 0xF5D887
      comment_text_color: 0xE6B687
      hilited_back_color: 0x473A33
      hilited_candidate_back_color: 0x5D4C43
      hilited_candidate_text_color: 0xC0E077
      hilited_text_color: 0x6EC8F5
      text_color: 0x78E8F0
